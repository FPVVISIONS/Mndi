plugins {
    id 'com.android.application'
}

// Release signing comes from the environment so no key ever lives in the repository.
def keystoreFile = file(System.getenv('MARQUEE_KEYSTORE') ?: 'missing.keystore')

android {
    namespace 'app.marquee'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'app.marquee'
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName '0.3.2'
        externalNativeBuild {
            cmake {
                // libnode links against the shared C++ runtime, so it must ship with the app.
                // 16 KB-aligned so it loads on phones that use 16 KB memory pages (Android 15+).
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                cppFlags '-std=c++17'
            }
        }
    }

    // One APK per CPU type keeps each download around half the size of a universal one.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            // Also one APK that runs on every phone, tablet and PC emulator.
            universalApk true
        }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('MARQUEE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MARQUEE_KEY_ALIAS') ?: 'marquee'
                keyPassword System.getenv('MARQUEE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libnode/bin']
        }
    }

    packaging {
        jniLibs {
            // Compress libnode in the APK (it is large) and extract it at install time.
            useLegacyPackaging true
        }
    }

    lint {
        // The media3 player APIs are marked unstable for lint only; they are stable in practice.
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native video player: plays MKV, seeks quickly and decodes the surround audio formats
    // (AC3, E-AC3, DTS, TrueHD) that a web view cannot, using FFmpeg's software decoders.
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-ui:1.5.0'
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'
}
